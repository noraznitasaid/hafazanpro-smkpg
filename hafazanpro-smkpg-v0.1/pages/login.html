<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HafazanPro</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        body{

            background:linear-gradient(135deg,#0B5D4B,#1E8E5A);

            display:flex;

            justify-content:center;

            align-items:center;

            height:100vh;

        }

        .card{

            background:white;

            width:380px;

            padding:40px;

            border-radius:20px;

            box-shadow:0 20px 40px rgba(0,0,0,.2);

            text-align:center;

        }

        .logo{

            width:120px;

            margin-bottom:15px;

        }

        h1{

            color:#0B5D4B;

            margin-bottom:5px;

        }

        p{

            color:#666;

            margin-bottom:25px;

        }

        input{

            width:100%;

            padding:14px;

            margin:10px 0;

            border-radius:10px;

            border:1px solid #ddd;

            font-size:16px;

        }

        button{

            width:100%;

            padding:14px;

            background:#0B5D4B;

            color:white;

            border:none;

            border-radius:10px;

            font-size:18px;

            cursor:pointer;

        }

        button:hover{

            background:#094638;

        }

    </style>

</head>

<body>

<div class="card">

<img src="../assets/logo/logo.png" class="logo">

<h1>HafazanPro</h1>

<p>SMK Pasir Gudang</p>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button onclick="location.href='dashboard.html'">

LOGIN

</button>

</div>

</body>

</html>
